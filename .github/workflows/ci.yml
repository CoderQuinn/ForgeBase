name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift package gate
    runs-on: macos-15
    timeout-minutes: 20
    env:
      FORGEBASE_LINE_COVERAGE_MIN: "95.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Print toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun llvm-cov --version

      - name: Resolve package from clean checkout
        run: |
          swift package reset
          swift package resolve

      - name: Lint Swift formatting
        run: |
          ./Scripts/ci/check-swift-format.sh

      - name: Build and test Debug
        run: |
          swift package clean
          swift build --configuration debug -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test --configuration debug -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build and test Release
        run: |
          swift package clean
          swift build --configuration release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test --configuration release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Run production coverage gate
        run: ./Scripts/ci/check-swift-coverage.sh
